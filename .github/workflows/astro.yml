# Astro: build from src/ and deploy the static output to GitHub Pages.
# Runs after `render-releases` when a new release pushes `src/data/releases.json`
# and also on `workflow_dispatch` so preview builds refresh.
name: astro-site

on:
  push:
    branches: [main]
    paths:
      - src/**
      - .github/workflows/astro.yml
      - package.json
      - package-lock.json
      - astro.config.ts
      - tsconfig.json
      - public/**
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
